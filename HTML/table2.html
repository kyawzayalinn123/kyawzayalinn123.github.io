<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Slip Voucher</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <tr>
            <th>No.</th>
            <th>Item Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Amount</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Cookie</td>
            <td>5000 MMK</td>
            <td>3</td>
            <td>15000 MMK</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Coffee</td>
            <td>4500 MMK</td>
            <td>2</td>
            <td>9000 MMK</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Water</td>
            <td>1000 MMK</td>
            <td>2</td>
            <td>2000 MMK</td>
        </tr>
        <tfoot>
            <td colspan="4" align="right">Total</td>
            <td>26000 MMK</td>
        </tfoot>
    </table>

    <h1>Save Money</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
                <th>Months</th>
                <th>Save Money</th>
                <th>Total</th>
                </tr>
                <tr>
                    <td>Janurary</td>
                    <td>150000</td>
                    <td rowspan="3">350000</td>
                </tr>
                <tr>
                    <td>February</td>
                    <td>50000</td>
                </tr>
                <tr>
                    <td>March</td>
                    <td>150000</td>
                </tr>
        </thead>
    </table>

    
</body>
</html>
