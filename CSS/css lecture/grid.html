<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Lessons</title>
    <link rel="stylesheet" href="custom.css">
</head>
<body>
     <h1>Grid Lessons</h1>
     <div class="gridOne">
        <div style="background-color: red;">1</div>
        <div style="background-color: gray;">2</div>
        <div style="background-color: green;">3</div>
        <div style="background-color: pink;">4</div>
        <div style="background-color: purple;">5</div>
        <div style="background-color: orange;">6</div>
        <div style="background-color: blue;">7</div>
        <div style="background-color: black;">8</div>
        <div style="background-color: brown;">9</div>

     </div>

     <h1>Grid Column Add</h1>
     <div class="gridTwo">
        <div style="background-color: red;">1</div>
        <div style="background-color: gray;">2</div>
        <div style="background-color: green;">3</div>
        <div style="background-color: pink;">4</div>
        <div style="background-color: purple;" class="columnAdd">5</div>
        <div style="background-color: orange;">6</div>
        <div style="background-color: blue;">7</div>
        <div style="background-color: black;">8</div>
        <div style="background-color: brown;">9</div>

     </div>

     <h1>Grid Row Add</h1>
     <div class="gridThree">
        <div style="background-color: red;">1</div>
        <div style="background-color: gray;" class="rowAdd">2</div>
        <div style="background-color: green;">3</div>
        <div style="background-color: pink;">4</div>
        <div style="background-color: purple;">5</div>
        <div style="background-color: orange;">6</div>
        <div style="background-color: blue;">7</div>
        <div style="background-color: black;">8</div>
        <div style="background-color: brown;">9</div>

     </div>
    
    
    
</body>
</html>
